    <path d="M 256 460 C 256 360 250 260 256 180" fill="none" stroke="#10b981" stroke-width="24" stroke-linecap="round"/>
    <path d="M 256 220 C 180 200 110 240 70 310 C 60 330 80 340 100 330 C 150 290 200 280 256 280" fill="#064e3b" stroke="#10b981" stroke-width="12" stroke-linejoin="round"/>
